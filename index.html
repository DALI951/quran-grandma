<!doctype html>
<html lang="ar" dir="rtl" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaThemeColor" content="#0b6b4a">
<meta name="description" content="مصحف بسيط ومريح لقراءة القرآن الكريم بدون إنترنت">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>القرآن الكريم</title>
</head>
<body>

<section id="home">
  <header class="homeTop">
    <div class="homeBrand">
      <h1 class="homeTitle">القرآن الكريم</h1>
      <p class="homeSub">قراءة مريحة بدون إنترنت</p>
    </div>
    <button type="button" id="homeSettingsBtn" class="iconLabelBtn" aria-label="فتح الإعدادات">
      <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.78 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>الإعدادات</span>
    </button>
  </header>

  <div id="heroWrap" class="heroWrap" hidden>
    <button type="button" id="continueBtn" class="continueCard">
      <span class="heroIcon" aria-hidden="true">
        <svg class="ico ico-lg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      </span>
      <span class="heroText">
        <span class="heroKicker">أكملي القراءة</span>
        <span class="heroMain" id="continueText"></span>
      </span>
      <span class="heroArr" aria-hidden="true">
        <svg class="ico ico-lg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </span>
    </button>
  </div>

  <nav id="tabBar" class="tabbar" role="tablist" aria-label="أقسام المصحف">
    <button type="button" role="tab" id="tabBtn-favs" class="tabBtn is-active" data-tab="favs" aria-selected="true" aria-controls="panel-favs">
      <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>المفضلة</span>
    </button>
    <button type="button" role="tab" id="tabBtn-surahs" class="tabBtn" data-tab="surahs" aria-selected="false" aria-controls="panel-surahs">
      <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <circle cx="4" cy="6" r="1"></circle>
        <circle cx="4" cy="12" r="1"></circle>
        <circle cx="4" cy="18" r="1"></circle>
      </svg>
      <span>السور</span>
    </button>
    <button type="button" role="tab" id="tabBtn-juz" class="tabBtn" data-tab="juz" aria-selected="false" aria-controls="panel-juz">
      <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>الأجزاء</span>
    </button>
  </nav>

  <main class="homeMain">
    <div id="panel-favs" class="tabPanel" role="tabpanel" aria-labelledby="tabBtn-favs">
      <section class="homeSec">
        <h2 class="secTitle">السور المختارة</h2>
        <div id="defaultFavsGrid" class="favGrid"></div>
      </section>

      <section class="homeSec" id="specialShortcutsSec">
        <div id="specialShortcuts"></div>
      </section>

      <section class="homeSec" id="savedFavsSec">
        <h2 class="secTitle">سورك المحفوظة</h2>
        <div id="savedFavsList"></div>
      </section>
    </div>

    <div id="panel-surahs" class="tabPanel" role="tabpanel" aria-labelledby="tabBtn-surahs" hidden>
      <div id="rangePills" class="rangePills" aria-label="الانتقال السريع بين السور"></div>
      <ul id="surahList" class="surahList"></ul>
    </div>

    <div id="panel-juz" class="tabPanel" role="tabpanel" aria-labelledby="tabBtn-juz" hidden>
      <div id="juzList" class="juzList"></div>
    </div>
  </main>

  <footer class="homeFooter">
    <span>يقرأ مباشرة من الجهاز — بدون إنترنت</span>
    <span id="homeVersion" class="verText"></span>
  </footer>
</section>

<section id="reader" class="fs-2" hidden>
  <header class="readerTop" id="readerTop">
    <div class="readerHead">
      <button type="button" id="backBtn" class="readerBackBtn" aria-label="الرجوع إلى الرئيسية">
        <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
        <span>رجوع</span>
      </button>
      <h2 id="readerTitle" class="readerTitle"></h2>
      <button type="button" id="favBtn" class="readerFavBtn" aria-label="حفظ السورة في المحفوظات" aria-pressed="false">
        <svg class="ico ico-star" aria-hidden="true" focusable="false" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span id="favBtnLabel">حفظ</span>
      </button>
    </div>
    <p id="readerMeta" class="readerMeta"></p>
  </header>

  <div id="jumpBanner" class="jumpBanner" hidden></div>
  <div id="readerStatus" class="readerStatus" hidden></div>
  <article id="surahBody" class="surahBody"></article>

  <nav class="readerFootBar" id="readerFootBar" aria-label="أدوات القراءة">
    <button type="button" id="fsDown" class="footBtn footSizeBtn" aria-label="تصغير الخط">أ−</button>
    <button type="button" id="fsUp" class="footBtn footSizeBtn" aria-label="تكبير الخط">أ+</button>
    <button type="button" id="themeCycleBtn" class="footBtn footThemeBtn" aria-label="تغيير المظهر">
      <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3v18"></path>
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path>
      </svg>
      <span id="themeCycleLabel">ورقي</span>
    </button>
    <button type="button" id="readerSettingsBtn" class="footBtn footSettingsBtn" aria-label="فتح الإعدادات">
      <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.78 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>الإعدادات</span>
    </button>
  </nav>
</section>

<div id="settingsModal" class="modalOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modalBackdrop" id="settingsBackdrop"></div>
  <div class="modalCard">
    <div class="modalHead">
      <h2 id="settingsTitle" class="modalTitle">الإعدادات</h2>
      <button type="button" id="closeSettingsBtn" class="modalCloseBtn" aria-label="إغلاق الإعدادات">
        <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>إغلاق</span>
      </button>
    </div>

    <div class="modalBody">
      <div class="settingGroup">
        <p class="settingLabel">طريقة عرض الآيات</p>
        <div class="choiceRow" id="readingModeChoices">
          <button type="button" class="choiceBtn" data-mode="flowing">مصحف متصل</button>
          <button type="button" class="choiceBtn" data-mode="verse">آية بآية</button>
        </div>
      </div>

      <div class="settingGroup">
        <p class="settingLabel">شكل الأرقام</p>
        <div class="choiceRow" id="numeralsChoices">
          <button type="button" class="choiceBtn" data-numerals="arabic">أرقام عربية ١٢٣</button>
          <button type="button" class="choiceBtn" data-numerals="western">أرقام مغاربية 123</button>
        </div>
      </div>

      <div class="settingGroup">
        <p class="settingLabel">ألوان القراءة</p>
        <div class="choiceRow" id="themeChoices">
          <button type="button" class="choiceBtn" data-theme="cream">ورقي</button>
          <button type="button" class="choiceBtn" data-theme="night">ليلي</button>
          <button type="button" class="choiceBtn" data-theme="contrast">واضح</button>
        </div>
      </div>

      <div class="settingGroup settingUpdates">
        <div class="verRow">
          <span class="settingLabel">إصدار التطبيق</span>
          <span id="settingsVersion" class="verBadge">النسخة 2.0.0</span>
        </div>
        <button type="button" id="checkUpdateBtn" class="updateBtn">
          <svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>التحقق من التحديثات</span>
        </button>
        <div id="updateStatus" class="updateStatus" hidden>
          <p id="updateMsg" class="updateMsg"></p>
          <button type="button" id="downloadUpdateBtn" class="downloadBtn" hidden>تحميل التحديث</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="app-config.js"></script>
<script src="data/meta.js"></script>
<script src="app.js"></script>
</body>
</html>
